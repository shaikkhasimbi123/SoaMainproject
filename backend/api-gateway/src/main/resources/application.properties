server.port=8080
spring.application.name=api-gateway

# Eureka Service Discovery Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# SOA Downstream Microservices Routing Endpoints
services.auth.url=http://localhost:8081
services.course.url=http://localhost:8082
services.enrollment.url=http://localhost:8083
services.payment.url=http://localhost:8084

management.endpoints.web.exposure.include=health,info
